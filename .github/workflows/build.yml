name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    # LANGKAH BARU: Siapkan environment MSVC (Visual Studio C++)
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.20'

    - name: Configure CMake
      run: cmake -B build/release -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build/release --config Release --target SteamlessController

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamlessController-Windows
        path: build/release/Release/SteamlessController.exe
