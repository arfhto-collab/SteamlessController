name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Runner ini sekarang menyediakan VS 2026 + CMake modern,
    # sudah terbukti sukses di workflow release.yml asli
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Menggunakan preset dari CMakePresets.json (cara yang dipakai release.yml)
      # Tidak perlu ilammy/msvc-dev-cmd atau jwlawson/actions-setup-cmake lagi
      - name: Configure and Build
        run: |
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }

      - name: Collect Executables
        run: |
          New-Item -ItemType Directory staging -Force | Out-Null
          Copy-Item "build\release\Release\SteamlessController.exe" staging\
          Copy-Item "build\release\Release\SteamlessDeviceCycle.exe" staging\
          Copy-Item "build\release\Release\ViGEmBusProbe.exe" staging\

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SteamlessController-Windows
          path: staging\*.exe
